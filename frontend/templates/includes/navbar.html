{% load static %}

<header class="site-header">
  <div class="container nav">

    <a href="{% url 'frontend:landing' %}" class="brand">
      <img class="brand-mark" src="{% static 'images/logo.png' %}" alt="" aria-hidden="true">
      Stockwell
    </a>

    <ul class="nav-links" data-nav-links>
      <li><a href="{% url 'frontend:landing' %}#features">Features</a></li>

{# Assumption: no block tags here -- those only resolve in the base template. #}
<div class="topbar-actions">
  <div class="dropdown" id="notifDropdown">
    <button class="icon-btn" type="button" aria-label="Notifications" aria-expanded="false" data-dropdown-toggle>
      <svg class="icon"><use href="#icon-bell"></use></svg>
      <span class="dot" id="notifBadge" hidden></span>
    </button>
    <div class="dropdown-menu dropdown-menu-right" role="menu">
      <div class="dropdown-menu-header">Notifications</div>
      <div id="topbarNotifList"></div>
      <a href="/notifications/" class="dropdown-menu-footer" role="menuitem">View all notifications</a>
    </div>
  </div>

  <div class="topbar-divider"></div>

  <div class="dropdown" id="userMenuDropdown">
    <button class="topbar-user" type="button" aria-expanded="false" data-dropdown-toggle>
      <div class="avatar">
        {% if request.user.profile_image %}
          <img src="{{ request.user.profile_image.url }}" alt="">
        {% else %}
          {{ request.user.get_initials|default:"AT" }}
        {% endif %}
      </div>
      <div class="topbar-user-info">
        <div class="name">{{ request.user.get_full_name|default:"Amara Tenzin" }}</div>
        <div class="role">{{ request.user.get_role_display|default:"System Administrator" }}</div>
      </div>
      <svg class="icon"><use href="#icon-chevron-down"></use></svg>
    </button>
    <div class="dropdown-menu dropdown-menu-right" role="menu">
      <a href="{% url 'frontend:profile' %}" class="dropdown-menu-footer" role="menuitem">My Profile</a>
      <form method="post" action="{% url 'frontend:logout' %}">
        {% csrf_token %}
        <button type="submit" class="dropdown-menu-footer" style="width:100%; border:none; background:none; cursor:pointer;" role="menuitem">Log out</button>
      </form>
    </div>
  </div>
</div>
